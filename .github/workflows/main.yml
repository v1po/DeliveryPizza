name: CI/CD

on:
  push:
    branches: ["main"]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./DeliveryPizza-backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest black ruff

      - name: Lint (black + ruff)
        working-directory: ./DeliveryPizza-backend
        run: |
          black --check .
          ruff check .

      - name: Run tests
        working-directory: ./DeliveryPizza-backend
        run: pytest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: backend   # деплой только если тесты прошли

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /var/www/app
            git pull
            npm install
            pm2 restart all