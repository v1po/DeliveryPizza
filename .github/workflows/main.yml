name: CI/CD

on:
  push:
    branches: ["main"]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./DeliveryPizza-backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest black ruff

      - name: Lint (black + ruff)
        working-directory: ./DeliveryPizza-backend
        run: |
          black --check .
          ruff check .

      - name: Run tests
        working-directory: ./DeliveryPizza-backend
        run: pytest

  deploy:
    name: Deploy
    runs-on: self-hosted

    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Deploy app
        run: |
          cd /home/v1po/app
          docker compose down
          docker compose up -d --build