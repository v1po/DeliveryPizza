name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest black isort ruff
          python -m pip install .
      - name: Lint backend
        run: |
          python -m black --check .
          python -m isort . --check-only
          python -m ruff check .
      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Lint and type-check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend service images
        run: |
          for service in auth catalog gateway order; do
            docker build -t deliverypizza-${service} ./DeliveryPizza-backend/services/$service
          done
      - name: Build frontend image
        run: docker build -t deliverypizza-frontend ./DeliveryPizza-frontend
    deploy:
    name: Deploy to VM
    runs-on: self-hosted
    needs: docker-build

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy application
        run: |
          cd /opt/deliverypizza

          git pull origin main

          docker compose down

          docker compose up -d --build