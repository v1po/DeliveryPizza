name: CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./DeliveryPizza-backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest black ruff

      - name: Lint (black + ruff)
        working-directory: ./DeliveryPizza-backend
        run: |
          black --check .
          ruff check .

      - name: Run tests
        working-directory: ./DeliveryPizza-backend
        run: pytest

  deploy:
    name: Deploy
    runs-on: self-hosted

    needs: backend

    steps:
      - name: Deploy app
        run: |
          APP_DIR="/home/v1po/app"
          REPO_URL="https://github.com/v1po/DeliveryPizza.git"

          # Если проекта нет — клонируем
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Project not found. Cloning repository..."

            git clone "$REPO_URL" "$APP_DIR"

          else
            echo "Project exists. Updating..."

            cd "$APP_DIR"

            git reset --hard
            git clean -fd

            git pull origin main

            echo "Stopping old containers..."
            docker compose down
          fi

          echo "Starting application..."

          cd "$APP_DIR"

          docker compose up -d --build